name: Python experiments
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run all twelve experiments including the precision ladder
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  experiments:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/weil-matplotlib
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - run: python -m pip install uv==0.8.24
      - run: uv sync --locked
      - run: uv run --locked python scripts/check_release.py
      - name: Smoke tests
        working-directory: experiments
        run: uv run --locked python smoke_test.py
      - name: Full experiment suite
        if: github.event_name == 'workflow_dispatch' && inputs.full_suite
        working-directory: experiments
        run: uv run --locked python run_all.py --include-precision-ladder
