name: Editable notebooks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notebooks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/weil-notebook-matplotlib
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - run: python -m pip install uv==0.8.24
      - run: uv sync --locked --group notebooks
      - run: uv run --locked --group notebooks python scripts/check_release.py
      - run: uv run --locked --group notebooks marimo check --strict experiments/notebooks/playground_*.py
      - run: uv run --locked --group notebooks python scripts/test_notebooks.py
