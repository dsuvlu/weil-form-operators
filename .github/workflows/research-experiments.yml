name: Reviewed research diagnostics
on:
  pull_request:
    paths:
      - 'research/**'
      - '.github/workflows/research-experiments.yml'
      - 'experiments/high_precision.py'
      - 'experiments/precision.py'
      - 'experiments/presentation.py'
      - 'experiments/common.py'
      - 'experiments/requirements-lock.txt'
  push:
    paths:
      - 'research/**'
      - '.github/workflows/research-experiments.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/weil-research-matplotlib
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r research/experiments_13_16/requirements.txt
      - run: python research/experiments_13_16/check_integrity.py
      - run: python research/experiments_13_16/tests/test_reviewed.py
      - run: python research/experiments_13_16/smoke.py
      - run: python research/experiments_13_16/check_integrity.py
      - run: python scripts/check_release.py
